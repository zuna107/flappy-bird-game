<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Bird</title>
    <meta name="description" content="Flappy Bird — tap to flap, don't hit the pipes. A fun casual browser game with Google sign-in and leaderboard." />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --sky: #5BB8FF;
        --coral: #FF5E5B;
        --coral-dark: #C94040;
        --green: #3CB371;
        --white: #FAFAFA;
        --text: #1A1A2E;
        --muted: #6B7280;
        --border: #E8EDF2;
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'DM Sans', sans-serif;
        background: var(--white);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* ── HEADER ─────────────────────────────────────── */
      .site-header {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 24px;
        background: #fff;
        border-bottom: 1px solid var(--border);
        position: relative;
        z-index: 40;
      }

      .logo {
        font-family: 'Baloo 2', cursive;
        font-weight: 800;
        font-size: 22px;
        line-height: 1;
        letter-spacing: -0.5px;
        user-select: none;
      }
      .logo .logo-bird { color: var(--coral); }
      .logo .logo-flappy { color: var(--text); }

      .btn-coral {
        font-family: 'DM Sans', sans-serif;
        font-weight: 700;
        font-size: 13px;
        color: #fff;
        background: var(--coral);
        border: none;
        border-radius: 50px;
        padding: 10px 22px;
        cursor: pointer;
        box-shadow: 0 4px 0 var(--coral-dark);
        transition: transform 0.1s, box-shadow 0.1s;
        outline: none;
        user-select: none;
      }
      .btn-coral:active {
        transform: translateY(4px);
        box-shadow: none;
      }

      .btn-google {
        font-family: 'DM Sans', sans-serif;
        font-weight: 600;
        font-size: 13px;
        color: var(--text);
        background: #fff;
        border: 1.5px solid var(--border);
        border-radius: 50px;
        padding: 10px 22px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        transition: background 0.15s, box-shadow 0.15s;
        outline: none;
        user-select: none;
      }
      .btn-google:hover {
        background: #f5f5f5;
      }

      .google-g-svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }

      /* ── HEADER AUTH ───────────────────────────────── */
      .header-auth {
        display: flex;
        align-items: center;
        gap: 12px;
        position: relative;
      }

      .header-user-info {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .header-profile-wrap {
        position: relative;
      }

      .header-profile-trigger {
        display: flex;
        align-items: center;
        gap: 10px;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
      }

      .header-profile-trigger:hover .header-user-name {
        color: var(--coral);
      }

      .header-profile-panel {
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        width: min(280px, calc(100vw - 32px));
        background: #fff;
        border: 1.5px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 14px 30px rgba(25, 31, 52, 0.12);
        padding: 14px;
        z-index: 30;
      }

      .header-profile-panel.hidden {
        display: none;
      }

      .header-profile-panel-title {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 10px;
      }

      .header-profile-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .header-profile-input-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .header-profile-input {
        flex: 1;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
        font-family: 'DM Sans', sans-serif;
        font-size: 12px;
        color: var(--text);
        background: #fff;
      }

      .header-profile-input:focus {
        outline: none;
        border-color: var(--coral);
        box-shadow: 0 0 0 3px rgba(255, 95, 95, 0.14);
      }

      .header-profile-save {
        border: none;
        border-radius: 12px;
        background: var(--coral);
        color: #fff;
        padding: 10px 14px;
        font-family: 'DM Sans', sans-serif;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        flex-shrink: 0;
      }

      .header-profile-status {
        min-height: 16px;
        font-size: 11px;
        color: var(--muted);
      }

      .header-profile-status.error {
        color: #E45858;
      }

      .header-profile-email {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }

      .header-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--border);
      }

      .header-avatar-initial {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--coral);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Baloo 2', cursive;
        font-weight: 700;
        font-size: 14px;
        flex-shrink: 0;
      }

      .header-user-name {
        font-weight: 600;
        font-size: 13px;
        color: var(--text);
        max-width: 120px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .btn-signout-link {
        background: none;
        border: none;
        color: var(--muted);
        font-family: 'DM Sans', sans-serif;
        font-size: 12px;
        cursor: pointer;
        text-decoration: underline;
        padding: 0;
      }
      .btn-signout-link:hover { color: var(--coral); }

      /* ── MAIN LAYOUT ──────────────────────────────── */
      .main-layout {
        flex-grow: 1;
        width: 100%;
        max-width: 1100px;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        gap: 28px;
        padding: 28px 16px;
      }

      @media (max-width: 900px) {
        .main-layout {
          flex-direction: column;
          align-items: center;
        }
      }

      /* ── GAME FRAME ───────────────────────────────── */
      .game-frame {
        position: relative;
        width: 480px;
        height: 720px;
        max-width: 100%;
        border-radius: 16px;
        overflow: hidden;
        border: 1.5px solid var(--border);
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        flex-shrink: 0;
      }

      .game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: transparent;
        position: relative;
        z-index: 2;
      }

      /* ── CARD OVERLAYS ON CANVAS ───────────────────── */
      .overlay-base {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
        padding: 32px;
      }

      .card {
        background: #fff;
        border: 1.5px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        padding: 32px 28px;
        width: 100%;
        max-width: 340px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .card-title {
        font-family: 'Baloo 2', cursive;
        font-weight: 800;
        font-size: 32px;
        color: var(--text);
        text-align: center;
        line-height: 1.1;
      }
      .card-title .coral { color: var(--coral); }

      .card-subtitle {
        font-family: 'DM Sans', sans-serif;
        font-size: 14px;
        color: var(--muted);
        text-align: center;
        line-height: 1.4;
      }

      .card-actions {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .card-actions .btn-coral,
      .card-actions .btn-google {
        width: 100%;
        text-align: center;
        justify-content: center;
      }

      .best-score-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
      }
      .best-score-row .score-val {
        font-family: 'Baloo 2', cursive;
        font-weight: 700;
        font-size: 18px;
        color: var(--text);
      }

      .sound-toggle-btn {
        background: none;
        border: none;
        color: var(--muted);
        font-family: 'DM Sans', sans-serif;
        font-size: 12px;
        cursor: pointer;
        padding: 4px 0;
        user-select: none;
      }
      .sound-toggle-btn:hover { color: var(--text); }

      /* ── GAME OVER CARD ────────────────────────────── */
      .score-columns {
        display: flex;
        width: 100%;
        gap: 16px;
      }

      .score-col {
        flex: 1;
        text-align: center;
        padding: 12px 0;
        border: 1.5px solid var(--border);
        border-radius: 16px;
      }

      .score-col-label {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
      }

      .score-col-value {
        font-family: 'Baloo 2', cursive;
        font-weight: 800;
        font-size: 32px;
        color: var(--text);
        line-height: 1;
      }
      .score-col-value.coral { color: var(--coral); }

      .new-best-badge {
        display: none;
        font-family: 'DM Sans', sans-serif;
        font-weight: 700;
        font-size: 11px;
        color: var(--coral);
        margin-top: 2px;
      }
      .new-best-badge.visible { display: block; }

      .signin-link {
        background: none;
        border: none;
        color: var(--muted);
        font-family: 'DM Sans', sans-serif;
        font-size: 13px;
        cursor: pointer;
        text-decoration: underline;
        padding: 0;
      }
      .signin-link:hover { color: var(--coral); }

      /* ── AUTH ERROR ─────────────────────────────────── */
      .auth-error {
        font-size: 12px;
        color: var(--coral);
        text-align: center;
        min-height: 16px;
        margin-top: -6px;
      }

      /* ── LEADERBOARD PANEL ─────────────────────────── */
      .leaderboard-panel {
        background: #fff;
        border: 1.5px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        width: 340px;
        max-height: 720px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        flex-shrink: 0;
      }

      @media (max-width: 900px) {
        .leaderboard-panel {
          position: fixed;
          top: 0;
          right: 0;
          bottom: 0;
          width: 320px;
          max-height: 100vh;
          border-radius: 0;
          z-index: 50;
          transform: translateX(100%);
          transition: transform 0.3s ease;
        }
        .leaderboard-panel.open {
          transform: translateX(0);
        }
      }

      .lb-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 22px;
        border-bottom: 1px solid var(--border);
      }

      .lb-header-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .lb-title {
        font-family: 'Baloo 2', cursive;
        font-weight: 800;
        font-size: 20px;
        color: var(--text);
      }

      @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.8); }
      }

      .live-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
        animation: pulse-dot 2s ease-in-out infinite;
      }

      .lb-close-btn {
        display: none;
        background: none;
        border: 1px solid var(--border);
        border-radius: 50px;
        padding: 6px 14px;
        font-family: 'DM Sans', sans-serif;
        font-size: 12px;
        color: var(--muted);
        cursor: pointer;
      }

      @media (max-width: 900px) {
        .lb-close-btn { display: block; }
      }

      .lb-body {
        flex: 1;
        overflow-y: auto;
        position: relative;
      }

      .lb-list {
        padding: 12px 16px;
      }

      .lb-row {
        display: flex;
        align-items: center;
        padding: 10px 12px;
        border-radius: 10px;
        margin-bottom: 4px;
      }

      .lb-row.current-user {
        background: #FFF5F5;
        border-left: 3px solid var(--coral);
      }

      .lb-rank {
        font-family: 'Baloo 2', cursive;
        font-weight: 700;
        font-size: 14px;
        width: 32px;
        flex-shrink: 0;
        color: var(--muted);
      }
      .lb-rank.gold { color: #D4A017; }
      .lb-rank.silver { color: #8E8E8E; }
      .lb-rank.bronze { color: #A0522D; }

      .lb-name {
        flex: 1;
        font-size: 14px;
        font-weight: 500;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .lb-score {
        font-family: 'Baloo 2', cursive;
        font-weight: 700;
        font-size: 16px;
        color: var(--coral);
        flex-shrink: 0;
        margin-left: 12px;
      }

      /* ── LEADERBOARD LOCKED STATE ──────────────────── */
      .lb-locked-overlay {
        position: absolute;
        inset: 0;
        background: #F5F7FA;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px;
        gap: 14px;
        z-index: 5;
      }

      .lb-locked-overlay.hidden { display: none; }

      .lb-lock-icon {
        width: 44px;
        height: 44px;
        color: var(--muted);
      }

      .lb-lock-msg {
        font-size: 14px;
        color: var(--muted);
        text-align: center;
        line-height: 1.4;
      }

      /* ── LEADERBOARD FOOTER ────────────────────────── */
      .lb-footer {
        padding: 14px 22px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      .lb-footer.hidden { display: none; }

      .lb-footer-user {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .lb-footer-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        object-fit: cover;
      }

      .lb-footer-avatar-initial {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--coral);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Baloo 2', cursive;
        font-weight: 700;
        font-size: 12px;
        flex-shrink: 0;
      }

      .lb-footer-name {
        font-weight: 600;
        font-size: 12px;
        color: var(--text);
        max-width: 100px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      @media (max-width: 900px) {
        .lb-footer {
          align-items: center;
        }
      }

      /* ── MOBILE LEADERBOARD TOGGLE ─────────────────── */
      .mobile-lb-toggle {
        display: none;
        background: none;
        border: 1px solid var(--border);
        border-radius: 50px;
        padding: 8px 16px;
        font-family: 'DM Sans', sans-serif;
        font-size: 12px;
        color: var(--muted);
        cursor: pointer;
        margin-top: 8px;
      }
      @media (max-width: 900px) {
        .mobile-lb-toggle { display: inline-block; }
      }

      /* ── AUTH TOAST ─────────────────────────────────── */
      .auth-toast {
        position: absolute;
        top: 16px;
        left: 16px;
        right: 16px;
        z-index: 20;
        background: #fff;
        border: 1.5px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0;
        transform: translateY(-12px);
        pointer-events: none;
        transition: opacity 0.3s, transform 0.3s;
      }
      .auth-toast.visible {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      .toast-check {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #E8F8EF;
        color: var(--green);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        flex-shrink: 0;
      }

      .toast-text-main {
        font-weight: 700;
        font-size: 13px;
        color: var(--text);
      }

      .toast-text-sub {
        font-size: 11px;
        color: var(--muted);
        margin-top: 1px;
      }

      /* ── UTILITY ────────────────────────────────────── */
      .hidden { display: none !important; }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }
    </style>
  </head>
  <body>

    <!-- HEADER -->
    <header class="site-header" id="site-header">
      <div class="logo">
        <span class="logo-flappy">Flappy</span><span class="logo-bird">Bird</span>
      </div>
      <div class="header-auth" id="top-auth-node">
        <!-- Dynamic: sign in button or user info -->
      </div>
    </header>

    <!-- MAIN -->
    <main class="main-layout">

      <!-- GAME FRAME -->
      <div class="game-frame" id="game-frame">
        <canvas id="game-canvas" class="game-canvas" width="480" height="720"></canvas>

        <!-- START MENU OVERLAY -->
        <div class="overlay-base" id="menu-screen">
          <div class="card">
            <h2 class="card-title"><span class="coral">Flappy</span>Bird</h2>
            <p class="card-subtitle">Tap to flap. Don't hit the pipes.</p>
            <div class="card-actions">
              <button class="btn-coral" id="btn-start">Play</button>
              <button class="btn-google" id="btn-menu-g-login">
                <svg class="google-g-svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 019.5 24c0-1.59.28-3.14.76-4.59L2.56 13.22A23.94 23.94 0 000 24c0 3.77.87 7.34 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                Sign in with Google
              </button>
              <div class="auth-error" id="menu-auth-error"></div>
            </div>
            <div class="best-score-row">
              <span>Best</span>
              <span class="score-val" id="menu-best-score-badge">0</span>
            </div>
            <button class="sound-toggle-btn" id="btn-sound-toggle">
              <span id="sound-status-text">Sound on</span>
            </button>
            <!-- Logged-in user badge (starts hidden) -->
            <div id="menu-user-badge" class="hidden" style="display:none;width:100%;text-align:center;">
              <div style="display:flex;align-items:center;justify-content:center;gap:10px;">
                <span id="btn-badge-avatar-wrap"></span>
                <span id="btn-badge-name" style="font-weight:600;font-size:13px;color:var(--text);"></span>
                <button class="btn-signout-link" id="btn-logout">Sign out</button>
              </div>
            </div>
          </div>
        </div>

        <!-- GAME OVER OVERLAY -->
        <div class="overlay-base hidden" id="gameover-screen">
          <div class="card">
            <h2 class="card-title">Game Over</h2>
            <div class="score-columns">
              <div class="score-col">
                <div class="score-col-label">Score</div>
                <div class="score-col-value" id="gameover-score">0</div>
              </div>
              <div class="score-col">
                <div class="score-col-label">Best</div>
                <div class="score-col-value coral" id="gameover-best">0</div>
                <div class="new-best-badge" id="new-high-score-glow">New best!</div>
              </div>
            </div>
            <div class="card-actions">
              <button class="btn-coral" id="btn-restart">Play Again</button>
              <div id="gameover-g-prompt">
                <button class="signin-link" id="btn-gameover-g-login">Sign in to save your score</button>
              </div>
              <div class="auth-error" id="gameover-auth-error"></div>
            </div>
            <button class="mobile-lb-toggle" id="btn-mobile-leaderboard-toggle">View Leaderboard</button>
          </div>
        </div>

        <!-- AUTH TOAST -->
        <div class="auth-toast" id="auth-toast">
          <div class="toast-check">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div>
            <div class="toast-text-main">Signed in</div>
            <div class="toast-text-sub" id="auth-toast-desc"></div>
          </div>
        </div>
      </div>

      <!-- LEADERBOARD PANEL -->
      <div class="leaderboard-panel" id="leaderboard-panel">
        <div class="lb-header">
          <div class="lb-header-left">
            <h2 class="lb-title">Leaderboard</h2>
            <div class="live-dot"></div>
          </div>
          <button class="lb-close-btn" id="btn-close-leaderboard">Close</button>
        </div>

        <div class="lb-body">
          <!-- LOCKED OVERLAY -->
          <div class="lb-locked-overlay" id="leaderboard-lock-overlay">
            <svg class="lb-lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
            <p class="lb-lock-msg">Sign in to see the leaderboard and save your scores.</p>
            <button class="btn-coral" id="btn-lock-login">Sign In</button>
          </div>

          <!-- RANK LIST -->
          <div class="lb-list" id="leaderboard-list-container"></div>
        </div>

        <!-- FOOTER -->
        <div class="lb-footer hidden" id="leaderboard-unlocked-footer">
          <div class="lb-footer-user">
            <span id="footer-user-avatar-wrap"></span>
            <span class="lb-footer-name" id="footer-user-name"></span>
          </div>
          <button class="btn-signout-link" id="btn-leaderboard-logout">Sign out</button>
        </div>
      </div>

    </main>

    <script>
      // ─── GOOGLE OAUTH CONFIG ──────────────────────────────────────────────────────
      // 1. console.cloud.google.com → Create project
      // 2. APIs & Services → Credentials → OAuth 2.0 Client ID (Web application)
      // 3. Add your domain to Authorized JavaScript Origins
      // Reads from GOOGLE_CLIENT_ID in your .env file via Vite's HTML Env replacement
      const GOOGLE_CLIENT_ID = '%GOOGLE_CLIENT_ID%';
      // ─────────────────────────────────────────────────────────────────────────────

      // ==========================================
      // 1. CONFIGURATION CONSTANTS
      // ==========================================
      const CONFIG = {
        canvasWidth: 480,
        canvasHeight: 720,

        gravity: 0.36,
        clampedFallSpeed: 9.0,
        flapStrength: -6.8,

        pipeSpeedBase: 2.22,
        pipeSpeedMax: 4.5,
        pipeGapBase: 165,
        pipeGapMin: 125,
        pipeWidth: 70,
        pipeSpawnInterval: 140,

        groundHeightY: 660,

        birdSpawnX: 130,
        birdRadius: 15,
      };

      // ==========================================
      // 2. STATE CONTROLLERS & ENGINE VARIABLES
      // ==========================================
      const GAME_STATES = {
        MENU: 'state_menu',
        PLAYING: 'state_playing',
        DEAD: 'state_dead'
      };

      let state = {
        current: GAME_STATES.MENU,
        frameNum: 0,
        score: 0,
        highScore: parseInt(localStorage.getItem('flappy_bird_local_high_score')) || 0,
        isNewHighScoreTriggered: false,
        soundEnabled: true,

        bird: {
          x: CONFIG.birdSpawnX,
          y: CONFIG.canvasHeight / 2 - 50,
          velocity: 0,
          angle: 0,
          radius: CONFIG.birdRadius,
          wingPhase: 0,
          lastFlapFrame: 0,
          targetTilt: 0,
        },
        pipes: [],
        particles: [],
        clouds: [],
        sceneryShiftX: 0,
        groundShiftX: 0
      };

      // Default leaderboard (empty, only real accounts allowed)
      const DEF_LEADERBOARD = [];

      // ==========================================
      // 3. SYNTHESIZED SOUND SYSTEM (WEB AUDIO)
      // ==========================================
      class SoundEngine {
        constructor() {
          this.ctx = null;
        }

        init() {
          if (this.ctx) return;
          try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          } catch (e) {
            console.warn("Web Audio API is not supported in this browser.", e);
          }
        }

        playFlap() {
          if (!state.soundEnabled) return;
          this.init();
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();

          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(900, now + 0.08);

            gain.gain.setValueAtTime(0.12, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.08);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 0.08);
          } catch(err) { console.error(err); }
        }

        playScore() {
          if (!state.soundEnabled) return;
          this.init();
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();

          try {
            const now = this.ctx.currentTime;

            // Two-note ascending sine chime
            const osc1 = this.ctx.createOscillator();
            const gain1 = this.ctx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(660, now);
            gain1.gain.setValueAtTime(0.08, now);
            gain1.gain.linearRampToValueAtTime(0.001, now + 0.12);
            osc1.connect(gain1);
            gain1.connect(this.ctx.destination);
            osc1.start(now);
            osc1.stop(now + 0.12);

            const osc2 = this.ctx.createOscillator();
            const gain2 = this.ctx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(880, now + 0.08);
            gain2.gain.setValueAtTime(0.08, now + 0.08);
            gain2.gain.linearRampToValueAtTime(0.001, now + 0.25);
            osc2.connect(gain2);
            gain2.connect(this.ctx.destination);
            osc2.start(now + 0.08);
            osc2.stop(now + 0.25);
          } catch(err) { console.error(err); }
        }

        playHit() {
          // Death: slow descending sine, 400ms, comedic
          if (!state.soundEnabled) return;
          this.init();
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();

          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);

            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.4);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 0.4);
          } catch(err) { console.error(err); }
        }

        playFall() {
          // Already covered by playHit comedic descend
        }

        playHighScoreFanfare() {
          if (!state.soundEnabled) return;
          this.init();
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();

          try {
            const now = this.ctx.currentTime;
            // 4-note ascending arpeggio
            const notes = [523.25, 659.25, 783.99, 1046.50];
            const noteDur = 0.1;

            notes.forEach((freq, index) => {
              const ringTime = now + index * noteDur;
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();

              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, ringTime);

              gain.gain.setValueAtTime(0.06, ringTime);
              gain.gain.linearRampToValueAtTime(0.001, ringTime + noteDur * 0.9);

              osc.connect(gain);
              gain.connect(this.ctx.destination);

              osc.start(ringTime);
              osc.stop(ringTime + noteDur);
            });
          } catch(err) { console.error(err); }
        }
      }

      const sounds = new SoundEngine();

      // ==========================================
      // 4. GOOGLE OAUTH 2.0 AUTHENTICATION
      // ==========================================
      let googleTokenClient = null;

      const AuthSystem = {
        profile: {
          email: '',
          name: '',
          picture: '',
          loggedIn: false
        },
        isProfileEditorOpen: false,

        getCustomNameForEmail(email) {
          if (!email) return '';
          const storedEmail = localStorage.getItem('fb_user_custom_name_email') || '';
          if (storedEmail !== email) return '';
          return (localStorage.getItem('fb_user_custom_name') || '').trim();
        },

        persistProfile() {
          localStorage.setItem('fb_user_loggedIn', this.profile.loggedIn ? 'true' : 'false');
          localStorage.setItem('fb_user_name', this.profile.name);
          localStorage.setItem('fb_user_email', this.profile.email);
          localStorage.setItem('fb_user_picture', this.profile.picture);
        },

        init() {
          // Restore from localStorage
          const saved = localStorage.getItem('fb_user_loggedIn');
          if (saved === 'true') {
            this.profile.loggedIn = true;
            this.profile.email = localStorage.getItem('fb_user_email') || '';
            this.profile.name = this.getCustomNameForEmail(this.profile.email) || localStorage.getItem('fb_user_name') || '';
            this.profile.picture = localStorage.getItem('fb_user_picture') || '';
          }
          this.syncUI();
          this.initGoogleClient();
        },

        initGoogleClient() {
          if (!GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID === 'YOUR_CLIENT_ID_HERE.apps.googleusercontent.com' || GOOGLE_CLIENT_ID.startsWith('%')) {
            console.warn('Google OAuth: Using placeholder Client ID. Please set GOOGLE_CLIENT_ID in your .env file or index.html.');
            return;
          }
          try {
            if (typeof google !== 'undefined' && google.accounts && google.accounts.oauth2) {
              googleTokenClient = google.accounts.oauth2.initTokenClient({
                client_id: GOOGLE_CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email',
                callback: (tokenResponse) => {
                  if (tokenResponse.error) {
                    AuthSystem.showError('Authentication failed. Please try again.');
                    return;
                  }
                  AuthSystem.fetchUserInfo(tokenResponse.access_token);
                },
                error_callback: (err) => {
                  if (err.type === 'popup_closed') return;
                  AuthSystem.showError('Authentication was cancelled or failed.');
                }
              });
            }
          } catch (e) {
            console.warn('Google Identity Services not loaded yet.');
          }
        },

        async fetchUserInfo(accessToken) {
          try {
            const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
              headers: { 'Authorization': 'Bearer ' + accessToken }
            });
            if (!res.ok) throw new Error('Failed to fetch user info');
            const data = await res.json();

            this.profile.loggedIn = true;
            this.profile.email = data.email || '';
            this.profile.picture = data.picture || '';
            this.profile.name = this.getCustomNameForEmail(this.profile.email) || data.name || '';

            this.persistProfile();

            // Store token for revoke
            localStorage.setItem('fb_access_token', accessToken);

            this.clearErrors();
            showWelcomeToast(this.profile.name);
            this.syncUI();
            LeaderboardModel.submitRunScore(state.score);
          } catch (e) {
            this.showError('Could not retrieve profile. Please try again.');
          }
        },

        requestLogin() {
          if (!GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID === 'YOUR_CLIENT_ID_HERE.apps.googleusercontent.com' || GOOGLE_CLIENT_ID.startsWith('%')) {
            this.showError('Set GOOGLE_CLIENT_ID in your .env file first.');
            return;
          }
          if (!googleTokenClient) {
            this.initGoogleClient();
            if (!googleTokenClient) {
              this.showError('Google sign-in is not available. Check your Client ID.');
              return;
            }
          }
          this.clearErrors();
          googleTokenClient.requestAccessToken();
        },

        logout() {
          const token = localStorage.getItem('fb_access_token');
          if (token && typeof google !== 'undefined' && google.accounts && google.accounts.oauth2) {
            try {
              google.accounts.oauth2.revoke(token, () => {});
            } catch (e) { /* ignore */ }
          }

          this.profile.loggedIn = false;
          this.profile.name = '';
          this.profile.email = '';
          this.profile.picture = '';

          localStorage.removeItem('fb_user_loggedIn');
          localStorage.removeItem('fb_user_name');
          localStorage.removeItem('fb_user_email');
          localStorage.removeItem('fb_user_picture');
          localStorage.removeItem('fb_access_token');

          this.syncUI();
        },

        updateProfileName(nextName) {
          const cleanedName = nextName.trim().replace(/\s+/g, ' ');
          if (!this.profile.loggedIn) {
            return { ok: false, message: 'Sign in first to edit your profile.' };
          }
          if (cleanedName.length < 2) {
            return { ok: false, message: 'Name must be at least 2 characters.' };
          }

          this.profile.name = cleanedName;
          localStorage.setItem('fb_user_custom_name', cleanedName);
          localStorage.setItem('fb_user_custom_name_email', this.profile.email);
          this.persistProfile();
          this.syncUI();
          LeaderboardModel.updateCurrentUserName(cleanedName);

          return { ok: true, message: 'Profile name saved.' };
        },

        setProfileEditorOpen(isOpen) {
          this.isProfileEditorOpen = isOpen;
          this.syncUI();
        },

        showError(msg) {
          const el1 = document.getElementById('menu-auth-error');
          const el2 = document.getElementById('gameover-auth-error');
          if (el1) el1.textContent = msg;
          if (el2) el2.textContent = msg;
        },

        clearErrors() {
          const el1 = document.getElementById('menu-auth-error');
          const el2 = document.getElementById('gameover-auth-error');
          if (el1) el1.textContent = '';
          if (el2) el2.textContent = '';
        },

        _renderAvatar(size) {
          if (this.profile.picture) {
            const img = document.createElement('img');
            img.src = this.profile.picture;
            img.alt = '';
            img.referrerPolicy = 'no-referrer';
            img.style.width = size + 'px';
            img.style.height = size + 'px';
            img.style.borderRadius = '50%';
            img.style.objectFit = 'cover';
            img.style.border = '2px solid var(--border)';
            img.onerror = function() {
              this.style.display = 'none';
              const fallback = document.createElement('span');
              fallback.className = size > 30 ? 'header-avatar-initial' : 'lb-footer-avatar-initial';
              fallback.textContent = AuthSystem.profile.name.charAt(0).toUpperCase() || '?';
              this.parentNode.replaceChild(fallback, this);
            };
            return img;
          } else {
            const span = document.createElement('span');
            span.className = size > 30 ? 'header-avatar-initial' : 'lb-footer-avatar-initial';
            span.textContent = this.profile.name.charAt(0).toUpperCase() || '?';
            return span;
          }
        },

        syncUI() {
          const menuBadge = document.getElementById('menu-user-badge');
          const loginBtnMain = document.getElementById('btn-menu-g-login');
          const topAuthNode = document.getElementById('top-auth-node');
          const lockPanel = document.getElementById('leaderboard-lock-overlay');
          const unlockedFooter = document.getElementById('leaderboard-unlocked-footer');
          const gameoverPrompt = document.getElementById('gameover-g-prompt');

          if (this.profile.loggedIn) {
            // Menu badge
            menuBadge.style.display = 'block';
            menuBadge.classList.remove('hidden');
            loginBtnMain.classList.add('hidden');

            const badgeWrap = document.getElementById('btn-badge-avatar-wrap');
            badgeWrap.innerHTML = '';
            badgeWrap.appendChild(this._renderAvatar(28));
            document.getElementById('btn-badge-name').textContent = this.profile.name;

            // Leaderboard
            if (lockPanel) lockPanel.classList.add('hidden');
            if (unlockedFooter) unlockedFooter.classList.remove('hidden');
            if (gameoverPrompt) gameoverPrompt.classList.add('hidden');

            // Footer avatar
            const footerAvatarWrap = document.getElementById('footer-user-avatar-wrap');
            footerAvatarWrap.innerHTML = '';
            footerAvatarWrap.appendChild(this._renderAvatar(28));
            document.getElementById('footer-user-name').textContent = this.profile.name;

            // Header: show user info + sign out
            topAuthNode.innerHTML = '';
            const wrapper = document.createElement('div');
            wrapper.className = 'header-user-info';
            const profileWrap = document.createElement('div');
            profileWrap.className = 'header-profile-wrap';

            const triggerBtn = document.createElement('button');
            triggerBtn.className = 'header-profile-trigger';
            triggerBtn.type = 'button';
            triggerBtn.setAttribute('aria-expanded', this.isProfileEditorOpen ? 'true' : 'false');
            triggerBtn.appendChild(this._renderAvatar(32));

            const nameSpan = document.createElement('span');
            nameSpan.className = 'header-user-name';
            nameSpan.textContent = this.profile.name;
            triggerBtn.appendChild(nameSpan);
            triggerBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              AuthSystem.setProfileEditorOpen(!AuthSystem.isProfileEditorOpen);
            });
            profileWrap.appendChild(triggerBtn);

            const profilePanel = document.createElement('div');
            profilePanel.className = 'header-profile-panel' + (this.isProfileEditorOpen ? '' : ' hidden');
            profilePanel.id = 'header-profile-panel';
            profilePanel.addEventListener('click', (e) => e.stopPropagation());

            const panelTitle = document.createElement('div');
            panelTitle.className = 'header-profile-panel-title';
            panelTitle.textContent = 'Edit profile';
            profilePanel.appendChild(panelTitle);

            const form = document.createElement('form');
            form.className = 'header-profile-form';
            form.id = 'profile-name-form';

            const inputRow = document.createElement('div');
            inputRow.className = 'header-profile-input-row';

            const input = document.createElement('input');
            input.className = 'header-profile-input';
            input.id = 'profile-name-input';
            input.type = 'text';
            input.maxLength = 24;
            input.placeholder = 'Enter your name';
            input.value = this.profile.name;
            inputRow.appendChild(input);

            const saveButton = document.createElement('button');
            saveButton.className = 'header-profile-save';
            saveButton.type = 'submit';
            saveButton.textContent = 'Save';
            inputRow.appendChild(saveButton);
            form.appendChild(inputRow);

            const status = document.createElement('div');
            status.className = 'header-profile-status';
            status.id = 'profile-name-status';
            status.setAttribute('aria-live', 'polite');
            form.appendChild(status);

            if (this.profile.email) {
              const emailText = document.createElement('div');
              emailText.className = 'header-profile-email';
              emailText.textContent = this.profile.email;
              form.appendChild(emailText);
            }

            form.addEventListener('submit', (e) => {
              e.preventDefault();
              const result = AuthSystem.updateProfileName(input.value);
              status.textContent = result.message;
              status.classList.toggle('error', !result.ok);

              if (result.ok) {
                AuthSystem.isProfileEditorOpen = false;
                AuthSystem.syncUI();
              }
            });

            profilePanel.appendChild(form);
            profileWrap.appendChild(profilePanel);
            wrapper.appendChild(profileWrap);

            const signoutBtn = document.createElement('button');
            signoutBtn.className = 'btn-signout-link';
            signoutBtn.textContent = 'Sign out';
            signoutBtn.addEventListener('click', () => AuthSystem.logout());
            wrapper.appendChild(signoutBtn);

            topAuthNode.appendChild(wrapper);

          } else {
            // Locked
            menuBadge.style.display = 'none';
            menuBadge.classList.add('hidden');
            loginBtnMain.classList.remove('hidden');
            if (lockPanel) lockPanel.classList.remove('hidden');
            if (unlockedFooter) unlockedFooter.classList.add('hidden');
            if (gameoverPrompt) gameoverPrompt.classList.remove('hidden');
            this.isProfileEditorOpen = false;

            // Header: sign in button
            topAuthNode.innerHTML = '';
            const btn = document.createElement('button');
            btn.className = 'btn-coral';
            btn.textContent = 'Sign In';
            btn.addEventListener('click', () => AuthSystem.requestLogin());
            topAuthNode.appendChild(btn);
          }

          LeaderboardModel.refreshDOM();
        }
      };

      // ==========================================
      // 5. LOCAL-STORAGE LEADERBOARD MODEL
      // ==========================================
      const LeaderboardModel = {
        getScores() {
          // Clear any old simulated/fake leaderboard
          localStorage.removeItem('flappy_bird_leaderboard_simulated');
          
          let list = localStorage.getItem('flappy_bird_leaderboard');
          if (!list) {
            localStorage.setItem('flappy_bird_leaderboard', JSON.stringify([]));
            return [];
          }
          return JSON.parse(list);
        },

        submitRunScore(score) {
          if (!AuthSystem.profile.loggedIn) return;

          let players = this.getScores();
          const userEmail = AuthSystem.profile.email;
          const userName = AuthSystem.profile.name;

          // Deduplicate by email — keep highest score only
          let userRow = players.find(p => p.email === userEmail);

          if (userRow) {
            if (score > userRow.score) {
              userRow.score = score;
            }
            userRow.name = userName;
          } else {
            players.push({ name: userName, email: userEmail, score: score });
          }

          players.sort((a, b) => b.score - a.score);
          players = players.slice(0, 10);

          localStorage.setItem('flappy_bird_leaderboard', JSON.stringify(players));
          this.refreshDOM();
        },

        updateCurrentUserName(name) {
          if (!AuthSystem.profile.loggedIn) return;

          const userEmail = AuthSystem.profile.email;
          const players = this.getScores();
          let didUpdate = false;

          players.forEach((player) => {
            if (player.email === userEmail) {
              player.name = name;
              didUpdate = true;
            }
          });

          if (!didUpdate) return;

          localStorage.setItem('flappy_bird_leaderboard', JSON.stringify(players));
          this.refreshDOM();
        },

        refreshDOM() {
          const container = document.getElementById('leaderboard-list-container');
          if (!container) return;

          const entries = this.getScores();
          const activeEmail = AuthSystem.profile.email;

          container.innerHTML = '';

          if (entries.length === 0) {
            const emptyNode = document.createElement('div');
            emptyNode.className = 'lb-empty-msg';
            emptyNode.textContent = 'No scores yet. Play to set a record!';
            emptyNode.style.textAlign = 'center';
            emptyNode.style.padding = '40px 20px';
            emptyNode.style.color = 'var(--muted)';
            emptyNode.style.fontSize = '13px';
            container.appendChild(emptyNode);
            return;
          }

          entries.forEach((row, idx) => {
            const rank = idx + 1;
            const isSelf = AuthSystem.profile.loggedIn && row.email === activeEmail;

            const itemNode = document.createElement('div');
            itemNode.className = 'lb-row' + (isSelf ? ' current-user' : '');

            const rankSpan = document.createElement('span');
            rankSpan.className = 'lb-rank';
            if (rank === 1) rankSpan.classList.add('gold');
            else if (rank === 2) rankSpan.classList.add('silver');
            else if (rank === 3) rankSpan.classList.add('bronze');
            rankSpan.textContent = rank;

            const nameSpan = document.createElement('span');
            nameSpan.className = 'lb-name';
            nameSpan.textContent = row.name;

            const scoreSpan = document.createElement('span');
            scoreSpan.className = 'lb-score';
            scoreSpan.textContent = row.score;

            itemNode.appendChild(rankSpan);
            itemNode.appendChild(nameSpan);
            itemNode.appendChild(scoreSpan);
            container.appendChild(itemNode);
          });
        }
      };

      // ==========================================
      // 6. CANVAS GRAPHICS ENGINE
      // ==========================================
      const canvas = document.getElementById('game-canvas');
      const ctx = canvas.getContext('2d');

      // Setup clouds
      function setupWorldEntities() {
        state.clouds = [];
        // 3 fluffy clouds at different heights and positions
        state.clouds.push({ x: 60, y: 80, scale: 1.0, speed: 0.3 });
        state.clouds.push({ x: 280, y: 140, scale: 0.7, speed: 0.2 });
        state.clouds.push({ x: 440, y: 60, scale: 0.85, speed: 0.25 });
      }

      function drawSkyGradient() {
        const grad = ctx.createLinearGradient(0, 0, 0, CONFIG.groundHeightY);
        grad.addColorStop(0, '#87CEEB');
        grad.addColorStop(1, '#E8F4FD');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.groundHeightY);
      }

      function drawCloud(cx, cy, scale) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);
        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = 0.85;

        // Fluffy cloud made of overlapping circles
        ctx.beginPath();
        ctx.arc(0, 0, 25, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(-22, 6, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(22, 6, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(-10, -12, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(12, -10, 16, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawClouds() {
        state.clouds.forEach(cloud => {
          if (state.current === GAME_STATES.PLAYING) {
            cloud.x -= cloud.speed;
            if (cloud.x < -80) {
              cloud.x = CONFIG.canvasWidth + 80;
              cloud.y = 40 + Math.random() * 120;
            }
          }
          drawCloud(cloud.x, cloud.y, cloud.scale);
        });
      }

      function drawHills() {
        // Soft rolling hills at horizon
        ctx.save();
        ctx.fillStyle = '#C8E6C9';
        ctx.beginPath();
        ctx.moveTo(0, CONFIG.groundHeightY);

        // Rolling sine-wave hills
        for (let x = 0; x <= CONFIG.canvasWidth; x += 2) {
          const h1 = Math.sin(x * 0.008) * 28;
          const h2 = Math.sin(x * 0.015 + 1.5) * 18;
          const h3 = Math.sin(x * 0.005 + 3.0) * 22;
          const y = CONFIG.groundHeightY - 20 - h1 - h2 - h3;
          ctx.lineTo(x, y);
        }

        ctx.lineTo(CONFIG.canvasWidth, CONFIG.groundHeightY);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawGround() {
        const horizonY = CONFIG.groundHeightY;
        const gH = CONFIG.canvasHeight - horizonY;

        if (state.current === GAME_STATES.PLAYING) {
          const currentSpeedVal = Math.min(CONFIG.pipeSpeedMax, CONFIG.pipeSpeedBase + state.score * 0.05);
          state.groundShiftX = (state.groundShiftX + currentSpeedVal) % 40;
        }

        // Grass strip: 28px
        ctx.fillStyle = '#4CAF50';
        ctx.fillRect(0, horizonY, CONFIG.canvasWidth, 28);

        // Grass texture: small lighter triangles
        ctx.fillStyle = '#66BB6A';
        for (let x = -state.groundShiftX; x < CONFIG.canvasWidth + 20; x += 20) {
          ctx.beginPath();
          ctx.moveTo(x, horizonY + 28);
          ctx.lineTo(x + 6, horizonY);
          ctx.lineTo(x + 12, horizonY + 28);
          ctx.closePath();
          ctx.fill();
        }

        // Earth edge: 6px
        ctx.fillStyle = '#795548';
        ctx.fillRect(0, horizonY + 28, CONFIG.canvasWidth, 6);

        // Below earth fill
        ctx.fillStyle = '#8D6E63';
        ctx.fillRect(0, horizonY + 34, CONFIG.canvasWidth, gH - 34);
      }

      function drawPipes() {
        const capExtraWidth = 8;
        const capHeight = 26;

        state.pipes.forEach(pipe => {
          ctx.save();

          // ── UPPER PIPE ──
          // Body
          ctx.fillStyle = '#2ECC71';
          ctx.fillRect(pipe.x, 0, CONFIG.pipeWidth, pipe.top);

          // Cap (wider, darker)
          ctx.fillStyle = '#1A9950';
          ctx.fillRect(pipe.x - capExtraWidth, pipe.top - capHeight, CONFIG.pipeWidth + capExtraWidth * 2, capHeight);

          // White highlight on cap bottom edge
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(pipe.x - capExtraWidth, pipe.top);
          ctx.lineTo(pipe.x - capExtraWidth + CONFIG.pipeWidth + capExtraWidth * 2, pipe.top);
          ctx.stroke();

          // ── LOWER PIPE ──
          // Body
          ctx.fillStyle = '#2ECC71';
          ctx.fillRect(pipe.x, pipe.bottom, CONFIG.pipeWidth, CONFIG.groundHeightY - pipe.bottom);

          // Cap (wider, darker)
          ctx.fillStyle = '#1A9950';
          ctx.fillRect(pipe.x - capExtraWidth, pipe.bottom, CONFIG.pipeWidth + capExtraWidth * 2, capHeight);

          // White highlight on cap top edge
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(pipe.x - capExtraWidth, pipe.bottom);
          ctx.lineTo(pipe.x - capExtraWidth + CONFIG.pipeWidth + capExtraWidth * 2, pipe.bottom);
          ctx.stroke();

          ctx.restore();
        });
      }

      function drawBird() {
        const b = state.bird;
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.angle);

        // ── WING (behind body) ──
        ctx.save();
        ctx.translate(-6, 2);
        const wingAngle = Math.sin(b.wingPhase) * 0.6;
        ctx.rotate(wingAngle + b.velocity * 0.04);
        ctx.fillStyle = '#FFB74D';
        ctx.beginPath();
        ctx.ellipse(0, 0, 10, 5, -0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // ── BODY: yellow-orange round shape ──
        ctx.fillStyle = '#FFC107';
        ctx.beginPath();
        ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
        ctx.fill();

        // Lighter belly
        ctx.fillStyle = '#FFD54F';
        ctx.beginPath();
        ctx.arc(0, 3, b.radius * 0.7, 0, Math.PI * 2);
        ctx.fill();

        // ── EYES ──
        // White part (large)
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(6, -5, 6, 0, Math.PI * 2);
        ctx.fill();

        // Pupil — shifts up/down based on velocity
        const pupilOffsetY = Math.max(-2.5, Math.min(2.5, b.velocity * 0.4));
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(7.5, -5 + pupilOffsetY, 2.8, 0, Math.PI * 2);
        ctx.fill();

        // Eye shine
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(8.5, -6.5 + pupilOffsetY * 0.5, 1, 0, Math.PI * 2);
        ctx.fill();

        // ── CHEEK (pink circle) ──
        ctx.fillStyle = '#FF8A80';
        ctx.globalAlpha = 0.5;
        ctx.beginPath();
        ctx.arc(-2, 5, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;

        // ── BEAK (stubby orange) ──
        ctx.fillStyle = '#FF7043';
        ctx.beginPath();
        ctx.moveTo(12, -2);
        ctx.lineTo(19, 1);
        ctx.lineTo(12, 4);
        ctx.closePath();
        ctx.fill();

        // Dead state: X eyes
        if (state.current === GAME_STATES.DEAD) {
          ctx.strokeStyle = '#D32F2F';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(4, -7); ctx.lineTo(9, -3);
          ctx.moveTo(9, -7); ctx.lineTo(4, -3);
          ctx.stroke();
        }

        ctx.restore();
      }

      // ── SCORE PARTICLES: solid 5-pointed stars ──
      function drawStar5(cx, cy, outerR, innerR) {
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const r = i % 2 === 0 ? outerR : innerR;
          const a = (Math.PI / 2 * 3) + (i * Math.PI / 5);
          const x = cx + Math.cos(a) * r;
          const y = cy + Math.sin(a) * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
      }

      function spawnParticles(x, y, count) {
        const colors = ['#FF5E5B', '#5BB8FF', '#FFC107', '#3CB371', '#FF7043', '#FAFAFA'];
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const force = Math.random() * 3 + 1.5;
          state.particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * force,
            vy: Math.sin(angle) * force - 2,
            size: Math.random() * 4 + 2,
            alpha: 1.0,
            decay: Math.random() * 0.02 + 0.015,
            color: colors[Math.floor(Math.random() * colors.length)],
            gravity: 0.08
          });
        }
      }

      function drawParticles() {
        for (let i = state.particles.length - 1; i >= 0; i--) {
          const p = state.particles[i];
          p.x += p.vx;
          p.vy += p.gravity;
          p.y += p.vy;
          p.alpha -= p.decay;

          if (p.alpha <= 0) {
            state.particles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          drawStar5(p.x, p.y, p.size, p.size * 0.45);
          ctx.restore();
        }
      }

      function drawInGameScoreOverlay() {
        if (state.current === GAME_STATES.MENU) return;

        ctx.save();
        ctx.font = '700 48px "Baloo 2", cursive';
        ctx.textAlign = 'center';

        // Stroke outline
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(26, 26, 46, 0.6)';
        ctx.strokeText(state.score.toString(), CONFIG.canvasWidth / 2, 72);

        // White fill
        ctx.fillStyle = '#ffffff';
        ctx.fillText(state.score.toString(), CONFIG.canvasWidth / 2, 72);

        ctx.restore();
      }

      // ==========================================
      // 7. GAME PLAYBACK LOOPS & TRIGGERS
      // ==========================================
      function updatePhysics() {
        if (state.current === GAME_STATES.MENU) {
          state.bird.y = CONFIG.canvasHeight / 2 - 35 + Math.sin(state.frameNum * 0.08) * 12;
          state.bird.angle = Math.sin(state.frameNum * 0.08) * 0.12;
          return;
        }

        const b = state.bird;

        b.velocity = Math.min(CONFIG.clampedFallSpeed, b.velocity + CONFIG.gravity);
        b.y += b.velocity;

        if (state.current === GAME_STATES.PLAYING) {
          b.wingPhase += 0.2 + Math.abs(b.velocity) * 0.05;

          if (b.velocity < 1.0) {
            b.targetTilt = -0.4;
          } else {
            b.targetTilt = Math.min(1.2, -0.4 + (b.velocity - 1.0) * 0.18);
          }
          b.angle += (b.targetTilt - b.angle) * 0.15;
        } else if (state.current === GAME_STATES.DEAD) {
          b.angle += 0.12;
        }

        // Ground collision
        if (b.y + b.radius >= CONFIG.groundHeightY) {
          b.y = CONFIG.groundHeightY - b.radius;
          triggerCrashCollapse();
        }

        // Ceiling
        if (b.y - b.radius <= -30) {
          b.y = -30 + b.radius;
          triggerCrashCollapse();
        }

        if (state.current !== GAME_STATES.PLAYING) return;

        // Spawn pipes
        if (state.frameNum % CONFIG.pipeSpawnInterval === 0) {
          spawnGatePair();
        }

        const currentSpeedVal = Math.min(CONFIG.pipeSpeedMax, CONFIG.pipeSpeedBase + state.score * 0.05);

        for (let i = state.pipes.length - 1; i >= 0; i--) {
          const pipe = state.pipes[i];
          pipe.x -= currentSpeedVal;

          if (!pipe.passed && b.x > pipe.x + CONFIG.pipeWidth / 2) {
            pipe.passed = true;
            state.score++;
            sounds.playScore();

            // Score particles: 12 solid stars
            spawnParticles(pipe.x + CONFIG.pipeWidth / 2, (pipe.top + pipe.bottom) / 2, 12);

            if (state.score > state.highScore) {
              state.highScore = state.score;
              localStorage.setItem('flappy_bird_local_high_score', state.highScore);

              if (!state.isNewHighScoreTriggered) {
                state.isNewHighScoreTriggered = true;
                sounds.playHighScoreFanfare();
              }
            }
          }

          if (isBirdIntersectingPipe(b, pipe)) {
            triggerCrashCollapse();
          }

          if (pipe.x + CONFIG.pipeWidth < 0) {
            state.pipes.splice(i, 1);
          }
        }
      }

      function spawnGatePair() {
        const difficultyProgress = Math.min(1.0, state.score / 25);
        const gap = CONFIG.pipeGapBase - (CONFIG.pipeGapBase - CONFIG.pipeGapMin) * difficultyProgress;

        const marginY = 82;
        const playableRangeH = CONFIG.groundHeightY - gap - marginY * 2;
        const gateTopH = marginY + Math.random() * playableRangeH;

        state.pipes.push({
          x: CONFIG.canvasWidth,
          top: gateTopH,
          bottom: gateTopH + gap,
          passed: false
        });
      }

      function isBirdIntersectingPipe(bird, pipe) {
        const uClosestX = Math.max(pipe.x, Math.min(bird.x, pipe.x + CONFIG.pipeWidth));
        const uClosestY = Math.max(0, Math.min(bird.y, pipe.top));
        const uDistX = bird.x - uClosestX;
        const uDistY = bird.y - uClosestY;
        if (uDistX * uDistX + uDistY * uDistY < bird.radius * bird.radius) return true;

        const lClosestX = Math.max(pipe.x, Math.min(bird.x, pipe.x + CONFIG.pipeWidth));
        const lClosestY = Math.max(pipe.bottom, Math.min(bird.y, CONFIG.groundHeightY));
        const lDistX = bird.x - lClosestX;
        const lDistY = bird.y - lClosestY;
        if (lDistX * lDistX + lDistY * lDistY < bird.radius * bird.radius) return true;

        return false;
      }

      function triggerCrashCollapse() {
        if (state.current === GAME_STATES.DEAD) return;

        state.current = GAME_STATES.DEAD;
        sounds.playHit();

        // Crash particles
        spawnParticles(state.bird.x, state.bird.y, 16);

        LeaderboardModel.submitRunScore(state.score);

        setTimeout(() => {
          showGameOverScreen(true);
        }, 800);
      }

      function flapJump() {
        if (state.current === GAME_STATES.MENU) {
          startGameRun();
          return;
        }

        if (state.current === GAME_STATES.DEAD) return;

        state.bird.velocity = CONFIG.flapStrength;
        sounds.playFlap();
        state.bird.wingPhase = Math.PI;
      }

      function startGameRun() {
        sounds.init();

        state.current = GAME_STATES.PLAYING;
        state.score = 0;
        state.isNewHighScoreTriggered = false;
        state.pipes = [];
        state.particles = [];

        state.bird.x = CONFIG.birdSpawnX;
        state.bird.y = CONFIG.canvasHeight / 2 - 50;
        state.bird.velocity = CONFIG.flapStrength;
        state.bird.angle = 0;

        document.getElementById('menu-screen').classList.add('hidden');
        showGameOverScreen(false);
      }

      function resetToMenu() {
        state.current = GAME_STATES.MENU;
        state.score = 0;
        state.pipes = [];
        state.isNewHighScoreTriggered = false;

        state.bird.x = CONFIG.birdSpawnX;
        state.bird.y = CONFIG.canvasHeight / 2 - 50;
        state.bird.velocity = 0;
        state.bird.angle = 0;

        document.getElementById('menu-best-score-badge').innerText = state.highScore;
        document.getElementById('menu-screen').classList.remove('hidden');
        showGameOverScreen(false);
      }

      // ==========================================
      // 8. MASTER GAME LOOP
      // ==========================================
      function mainEngineLoop() {
        state.frameNum++;

        ctx.clearRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

        drawSkyGradient();
        drawClouds();
        drawHills();
        drawPipes();
        drawBird();
        drawParticles();
        drawGround();
        drawInGameScoreOverlay();

        updatePhysics();

        requestAnimationFrame(mainEngineLoop);
      }

      // ==========================================
      // 9. UI & DOM LISTENERS
      // ==========================================
      function showGameOverScreen(visible) {
        const screen = document.getElementById('gameover-screen');
        if (visible) {
          document.getElementById('gameover-score').innerText = state.score.toString();
          document.getElementById('gameover-best').innerText = state.highScore.toString();

          const badge = document.getElementById('new-high-score-glow');
          if (state.isNewHighScoreTriggered) {
            badge.classList.add('visible');
          } else {
            badge.classList.remove('visible');
          }

          screen.classList.remove('hidden');
        } else {
          screen.classList.add('hidden');
        }
      }

      function showWelcomeToast(username) {
        const toast = document.getElementById('auth-toast');
        document.getElementById('auth-toast-desc').textContent = 'Welcome, ' + username;
        toast.classList.add('visible');

        setTimeout(() => {
          toast.classList.remove('visible');
        }, 3500);
      }

      function syncSoundToggleUI() {
        const statusText = document.getElementById('sound-status-text');
        statusText.textContent = state.soundEnabled ? 'Sound on' : 'Sound off';
      }

      // Register listeners
      window.addEventListener('DOMContentLoaded', () => {
        setupWorldEntities();
        AuthSystem.init();

        // Retry Google client init after GIS library loads
        if (!googleTokenClient) {
          const retryInterval = setInterval(() => {
            if (typeof google !== 'undefined' && google.accounts && google.accounts.oauth2) {
              AuthSystem.initGoogleClient();
              clearInterval(retryInterval);
            }
          }, 500);
          // Stop trying after 10s
          setTimeout(() => clearInterval(retryInterval), 10000);
        }

        document.getElementById('menu-best-score-badge').innerText = state.highScore;

        // Start game
        document.getElementById('btn-start').addEventListener('click', (e) => {
          e.stopPropagation();
          startGameRun();
        });

        document.getElementById('btn-restart').addEventListener('click', (e) => {
          e.stopPropagation();
          startGameRun();
        });

        // Sound toggle
        document.getElementById('btn-sound-toggle').addEventListener('click', (e) => {
          e.stopPropagation();
          state.soundEnabled = !state.soundEnabled;
          syncSoundToggleUI();
          sounds.init();
        });

        // Google login buttons
        document.getElementById('btn-menu-g-login').addEventListener('click', (e) => {
          e.stopPropagation();
          AuthSystem.requestLogin();
        });
        document.getElementById('btn-lock-login').addEventListener('click', () => {
          AuthSystem.requestLogin();
        });
        document.getElementById('btn-gameover-g-login').addEventListener('click', (e) => {
          e.stopPropagation();
          AuthSystem.requestLogin();
        });

        // Logout
        document.getElementById('btn-logout').addEventListener('click', (e) => {
          e.stopPropagation();
          AuthSystem.logout();
        });
        document.getElementById('btn-leaderboard-logout').addEventListener('click', () => {
          AuthSystem.logout();
        });

        document.addEventListener('click', (e) => {
          const headerAuth = document.getElementById('top-auth-node');
          if (!AuthSystem.isProfileEditorOpen || !headerAuth) return;
          if (!headerAuth.contains(e.target)) {
            AuthSystem.setProfileEditorOpen(false);
          }
        });

        // Mobile leaderboard toggle
        const leaderboardPanel = document.getElementById('leaderboard-panel');
        document.getElementById('btn-mobile-leaderboard-toggle').addEventListener('click', (e) => {
          e.stopPropagation();
          leaderboardPanel.classList.add('open');
        });
        document.getElementById('btn-close-leaderboard').addEventListener('click', () => {
          leaderboardPanel.classList.remove('open');
        });

        // Keyboard
        window.addEventListener('keydown', (e) => {
          if (e.code === 'Space') {
            e.preventDefault();
            if (state.current === GAME_STATES.DEAD) {
              const rect = document.getElementById('gameover-screen');
              if (!rect.classList.contains('hidden')) {
                startGameRun();
              }
            } else {
              flapJump();
            }
          }
        });

        // Touch + click on canvas frame
        document.getElementById('game-frame').addEventListener('touchstart', (e) => {
          e.preventDefault();
          flapJump();
        }, { passive: false });

        document.getElementById('game-frame').addEventListener('mousedown', (e) => {
          if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
          e.preventDefault();
          flapJump();
        });

        // Start loop
        mainEngineLoop();
      });
    </script>
  </body>
</html>
